name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm OIDC

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the repo's .nvmrc and engines.
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Node 22 bundles npm 10.9.x; OIDC trusted publishing needs >= 11.5.1.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11

      - name: Check npm version
        id: version
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view "$PKG_NAME" version || echo "0.0.0")

          echo "📦 Package: $PKG_NAME"
          echo "📄 Local version: $LOCAL"
          echo "🌐 Published version: $REMOTE"

          if npx semver "$LOCAL" -r ">$REMOTE" >/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "✅ Version is greater — will publish"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Version not greater — skipping publish"
          fi

      - name: Wait for pinned @decibeltrade deps
        if: steps.version.outputs.publish == 'true'
        run: |
          # `npm publish` returns before the registry serves the version, and the
          # export writes these pins exact, so a sibling published seconds ago
          # fails `npm install` outright rather than resolving something older.
          SPECS=$(node -p '
            const p = require("./package.json");
            Object.entries({ ...p.dependencies, ...p.devDependencies })
              .filter(([n, v]) => n.startsWith("@decibeltrade/") && /^\d+\.\d+\.\d+$/.test(v))
              .map(([n, v]) => n + "@" + v)
              .join(" ")
          ')
          for SPEC in $SPECS; do
            for i in $(seq 1 30); do
              if npm view "$SPEC" version --prefer-online >/dev/null 2>&1; then
                echo "✅ $SPEC"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "::error::$SPEC never became available on npm"
                exit 1
              fi
              echo "⏳ waiting for $SPEC ($i/30)"
              sleep 10
            done
          done

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm install

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: npm run build --if-present

      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: npm test --if-present

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public
